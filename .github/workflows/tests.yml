name: CPU pipeline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code/business_entity_resolution/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r code/business_entity_resolution/requirements.txt
      - name: Core correctness and checkpoint tests
        env:
          PYTHONPATH: code/business_entity_resolution/src
        run: python -m unittest discover -s code/business_entity_resolution/tests -v
      - name: Dataset extraction and end-to-end package tests
        run: python -m unittest discover -s tests -v
